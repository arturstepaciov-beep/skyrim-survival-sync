# Quest sync v0.8.1 build requested 2026-10-18 (Vilnius).
name: Build Survival Sync Windows
run-name: Survival Sync v0.8.1 · ${{ github.run_number }} · ${{ github.event.head_commit.message || 'manual' }}
on:
  push:
    branches: [main, 'build/**']
    paths:
      - 'world-items-v0.2.patch'
      - 'quest-sync-v07.patch'
      - 'world-progress-v08.patch'
      - 'WorldProgressBindings.h.gz'
      - 'Build-Windows.ps1'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:
concurrency:
  group: survival-windows-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.1.0'
      - uses: actions/cache@v4
        with:
          path: ~/AppData/Local/.xmake/packages
          key: windows-xmake-worlditems-v02
          restore-keys: windows-xmake-
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set Vilnius build timestamp
        id: metadata
        shell: pwsh
        run: |
          $zone = [TimeZoneInfo]::FindSystemTimeZoneById('FLE Standard Time')
          $stamp = [TimeZoneInfo]::ConvertTimeFromUtc([DateTime]::UtcNow, $zone).ToString('yyyy-MM-dd_HH-mm-ss') + '-LT'
          "stamp=$stamp" >> $env:GITHUB_OUTPUT
          "name=SurvivalSync-v0.8.1-$stamp-Windows" >> $env:GITHUB_OUTPUT
      - name: Build and package custom client and server
        shell: pwsh
        run: ./Build-Windows.ps1 -WorkDirectory "${{ runner.temp }}/survival-build" -BuildStamp "${{ steps.metadata.outputs.stamp }}"
      - name: Upload Windows install package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.name }}
          path: ${{ runner.temp }}/survival-build/${{ steps.metadata.outputs.name }}.zip
          if-no-files-found: error
          retention-days: 14
